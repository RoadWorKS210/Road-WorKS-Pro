
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#10243a">
<title>Road WorKS Pro</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 18px;
  font-family: Arial, sans-serif;
  background: #10243a;
  color: white;
}

.container {
  max-width: 700px;
  margin: auto;
}

.card {
  background: #203750;
  border: 2px solid #34536b;
  border-radius: 24px;
  padding: 25px;
  margin-bottom: 25px;
}

h1, h2 {
  color: #ff861c;
}

h1 { font-size: 34px; }
h2 { font-size: 29px; }

.subtitle {
  color: #dce5ed;
  margin-top: -12px;
}

.tabs {
  display: flex;
  gap: 10px;
  margin-top: 25px;
}

.tabs button {
  flex: 1;
  padding: 17px 5px;
  border: 0;
  border-radius: 17px;
  background: #ff861c;
  color: #10243a;
  font-size: 16px;
  font-weight: bold;
}

.tabs button.active {
  background: white;
}

label {
  display: block;
  font-size: 17px;
  margin-top: 22px;
}

input {
  width: 100%;
  padding: 20px;
  margin-top: 9px;
  border: 2px solid #9cabb9;
  border-radius: 15px;
  background: white;
  color: #192c40;
  font-size: 22px;
  font-weight: bold;
}

.actions {
  display: flex;
  gap: 12px;
  margin-top: 25px;
}

.actions button {
  flex: 1;
  padding: 20px 8px;
  border: 0;
  border-radius: 16px;
  font-size: 17px;
  font-weight: bold;
  background: #ff861c;
  color: #10243a;
}

.actions .clear {
  background: #dce5ed;
}

.result {
  margin-top: 25px;
  padding: 22px;
  background: #14263b;
  border: 2px solid #ff861c;
  border-radius: 18px;
  font-size: 18px;
  line-height: 1.6;
  min-height: 100px;
}

.result strong {
  color: #ff861c;
}

.big-result {
  font-size: 32px;
  font-weight: bold;
  color: #ff861c;
}

.footer {
  text-align: center;
  color: #b5c1cf;
  padding: 25px 5px;
}

.calculator { display: none; }
.calculator.active { display: block; }

@media(max-width:420px) {
  .card { padding: 20px; }
  h1 { font-size: 29px; }
  h2 { font-size: 26px; }
  .tabs button { font-size: 14px; }
}
</style>
</head>

<body>
<div class="container">

<div class="card">
<h1>Road WorKS Pro</h1>
<p class="subtitle">Built for Your Roads.</p>

<h2>Material Calculators</h2>

<div class="tabs">
<button class="active" onclick="showCalculator('asphalt',this)">Asphalt</button>
<button onclick="showCalculator('concrete',this)">Concrete</button>
<button onclick="showCalculator('slurry',this)">Slurry</button>
</div>
</div>

<!-- ASPHALT -->

<div class="card calculator active" id="asphalt">
<h2>Asphalt Calculator</h2>

<label>Length (feet)</label>
<input type="number" id="aLength" placeholder="Enter length">

<label>Width (inches)</label>
<input type="number" id="aWidth" placeholder="Enter width">

<label>Depth (inches)</label>
<input type="number" id="aDepth" placeholder="Enter finished compacted depth">

<div class="actions">
<button onclick="calculateAsphalt()">CALCULATE</button>
<button class="clear" onclick="clearCalculator('asphalt')">CLEAR</button>
</div>

<div class="result" id="aResult">
Enter your measurements to get started.
</div>
</div>

<!-- CONCRETE -->

<div class="card calculator" id="concrete">
<h2>Concrete Calculator</h2>

<label>Length (feet)</label>
<input type="number" id="cLength" placeholder="Enter length">

<label>Width (inches)</label>
<input type="number" id="cWidth" placeholder="Enter width">

<label>Depth (inches)</label>
<input type="number" id="cDepth" placeholder="Enter depth">

<div class="actions">
<button onclick="calculateConcrete()">CALCULATE</button>
<button class="clear" onclick="clearCalculator('concrete')">CLEAR</button>
</div>

<div class="result" id="cResult">
Enter your measurements to get started.
</div>
</div>

<!-- SLURRY -->

<div class="card calculator" id="slurry">
<h2>Slurry Calculator</h2>

<label>Ditch Length (feet)</label>
<input type="number" id="sLength" placeholder="Enter ditch length">

<label>Ditch Width (inches)</label>
<input type="number" id="sWidth" placeholder="Enter ditch width">

<label>Ditch Depth (inches)</label>
<input type="number" id="sDepth" placeholder="Enter ditch depth">

<label>Pipe Outside Diameter (inches)</label>
<input type="number" id="sPipe" placeholder="Enter pipe outside diameter">

<label>Pipe Length (feet)</label>
<input type="number" id="sPipeLength" placeholder="Enter pipe length">

<div class="actions">
<button onclick="calculateSlurry()">CALCULATE</button>
<button class="clear" onclick="clearCalculator('slurry')">CLEAR</button>
</div>

<div class="result" id="sResult">
Enter your measurements to get started.
</div>
</div>

<div class="footer">
Road WorKS Pro · Built for Your Roads.
</div>

</div>

<script>

// SWITCH CALCULATORS

function showCalculator(name,button) {
  document.querySelectorAll('.calculator').forEach(el => {
    el.classList.remove('active');
  });

  document.getElementById(name).classList.add('active');

  document.querySelectorAll('.tabs button').forEach(el => {
    el.classList.remove('active');
  });

  button.classList.add('active');
}

// CHECK INPUTS

function getValues(ids) {
  const values = ids.map(id =>
    Number(document.getElementById(id).value)
  );

  if (values.some(v => !Number.isFinite(v) || v <= 0)) {
    return null;
  }

  return values;
}

// ASPHALT CALCULATOR
// Uses 150 pounds per cubic foot.
// Finished compacted depth.
// No automatic waste or extra material.

function calculateAsphalt() {
  const v = getValues(['aLength','aWidth','aDepth']);
  const result = document.getElementById('aResult');

  if (!v) {
    result.innerHTML = 'Please enter all three measurements.';
    return;
  }

  const [length,width,depth] = v;

  const cubicFeet =
    length * (width / 12) * (depth / 12);

  const tons = (cubicFeet * 150) / 2000;

  result.innerHTML = `
    <strong>ASPHALT REQUIRED</strong><br>
    <div class="big-result">${tons.toFixed(2)} Tons</div>
    Cubic Feet: ${cubicFeet.toFixed(2)}<br>
    Compacted Depth: ${depth} inches<br>
    <br>
    <strong>Exact calculated quantity.</strong>
    No extra material included.
  `;
}

// CONCRETE CALCULATOR

function calculateConcrete() {
  const v = getValues(['cLength','cWidth','cDepth']);
  const result = document.getElementById('cResult');

  if (!v) {
    result.innerHTML = 'Please enter all three measurements.';
    return;
  }

  const [length,width,depth] = v;

  const cubicFeet =
    length * (width / 12) * (depth / 12);

  const cubicYards = cubicFeet / 27;

  const bags80 = cubicFeet / 0.60;
  const bags60 = cubicFeet / 0.45;

  result.innerHTML = `
    <strong>CONCRETE REQUIRED</strong><br>
    <div class="big-result">${cubicYards.toFixed(2)} Cubic Yards</div>
    Cubic Feet: ${cubicFeet.toFixed(2)}<br>
    Approx. 80 lb bags: ${Math.ceil(bags80)}<br>
    Approx. 60 lb bags: ${Math.ceil(bags60)}
  `;
}

// SLURRY CALCULATOR
// Subtracts pipe displacement using outside diameter.

function calculateSlurry() {
  const v = getValues([
    'sLength','sWidth','sDepth','sPipe','sPipeLength'
  ]);

  const result = document.getElementById('sResult');

  if (!v) {
    result.innerHTML = 'Please enter all five measurements.';
    return;
  }

  const [length,width,depth,diameter,pipeLength] = v;

  const ditchVolume =
    length * (width / 12) * (depth / 12);

  const pipeRadius = diameter / 24;

  const pipeVolume =
    Math.PI * pipeRadius * pipeRadius * pipeLength;

  const fillVolume = ditchVolume - pipeVolume;

  if (fillVolume <= 0) {
    result.innerHTML =
      'Pipe volume is equal to or greater than ditch volume. Please check your measurements.';
    return;
  }

  const gallons = fillVolume * 7.48052;
  const cubicYards = fillVolume / 27;

  result.innerHTML = `
    <strong>SLURRY REQUIRED</strong><br>
    <div class="big-result">${gallons.toFixed(2)} Gallons</div>
    Cubic Feet: ${fillVolume.toFixed(2)}<br>
    Cubic Yards: ${cubicYards.toFixed(2)}<br>
    Pipe displacement subtracted.
  `;
}

// CLEAR INPUTS

function clearCalculator(name) {
  const section = document.getElementById(name);

  section.querySelectorAll('input').forEach(input => {
    input.value = '';
  });

  const result = section.querySelector('.result');

  result.innerHTML = 'Enter your measurements to get started.';
}

</script>
</body>
</html>
